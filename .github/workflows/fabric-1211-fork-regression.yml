name: "Fabric 1.21.1 fork regression"
on:
  push:
    branches: [master, restore-1211-lightning-rods-spawn-eggs-503]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  fabric-1-21-1:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Verify restored fork settings and creative filtering
        run: python3 .github/scripts/check_fabric_1211_toggles.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
      - name: Compile Fabric 1.21.1 only
        run: ./gradlew :fabric:1.21.1:build --stacktrace
      - name: Publish Fabric 1.21.1 JAR
        uses: actions/upload-artifact@v4
        with:
          name: friendsandfoes-5.0.3-fabric-1.21.1-fork-restored
          path: fabric/versions/1.21.1/build/libs/*.jar
          if-no-files-found: error
