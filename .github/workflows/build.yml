name: "Build"

on:
    workflow_dispatch:
    push:
        branches:
            - "**"
    pull_request:
        branches:
            - "**"
            - "!master"

jobs:
    generate-build-matrix:
        runs-on: ubuntu-latest
        name: Generate build matrix
        outputs:
            matrix: ${{ steps.set-matrix.outputs.matrix }}
        steps:
            -   name: "Checkout repository"
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            -   name: "Generate matrix for the run job"
                id: set-matrix
                run: ./.github/scripts/generate-run-matrix.sh

    build:
        runs-on: ubuntu-latest
        needs: generate-build-matrix
        continue-on-error: true
        timeout-minutes: 30
        name: Build ${{ matrix.mod_loader }} ${{ matrix.version }}
        strategy:
            fail-fast: false
            matrix: ${{ fromJson(needs.generate-build-matrix.outputs.matrix) }}

        steps:
            -   name: "Checkout repository"
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            -   name: "Set up JDK"
                uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
                with:
                    java-version: 25
                    distribution: temurin

            -   name: "Setup gradle"
                uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
                with:
                    cache-read-only: false
                    gradle-version: wrapper
                    add-job-summary: 'on-failure'

            -   name: "Parse gradle properties"
                id: gradle-properties
                run: ./.github/scripts/parse-gradle-properties.sh ${{ matrix.version }}

            -   name: "Check Fabric 1.21.1 fork options"
                if: ${{ matrix.mod_loader == 'fabric' && matrix.version == '1.21.1' }}
                run: python3 .github/scripts/check_fabric_1211_toggles.py

            -   name: "Run build"
                run: ./gradlew :${{ matrix.mod_loader }}:${{ matrix.version }}:build
            -   name: "Record original Fabric 1.21.1 JAR SHA-256"
                if: ${{ matrix.mod_loader == 'fabric' && matrix.version == '1.21.1' }}
                run: |
                    echo "### Unmodified Gradle JAR checksums" >> "$GITHUB_STEP_SUMMARY"
                    echo 'The Fabric 1.21.1 release is distributed as the original Gradle JAR, without an extra ZIP.' >> "$GITHUB_STEP_SUMMARY"
                    sha256sum ./fabric/versions/1.21.1/build/libs/*.jar | tee -a "$GITHUB_STEP_SUMMARY"


            -   name: "Identify default Fabric 1.21.1 JAR"
                id: default-fabric-jar
                if: ${{ matrix.mod_loader == 'fabric' && matrix.version == '1.21.1' }}
                shell: bash
                run: |
                    set -euo pipefail
                    jar="./fabric/versions/1.21.1/build/libs/${{ steps.gradle-properties.outputs.MOD_ID }}-fabric-${{ steps.gradle-properties.outputs.MOD_VERSION }}+mc1.21.1.jar"
                    if [ ! -f "$jar" ]; then
                        echo "::error::The original Gradle release JAR is missing; no file will be renamed."
                        ls -lah ./fabric/versions/1.21.1/build/libs/
                        exit 1
                    fi
                    echo "path=$jar" >> "$GITHUB_OUTPUT"

            -   name: "Upload artifacts"
                uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
                with:
                    name: ${{ steps.gradle-properties.outputs.MOD_ID }}-${{ matrix.mod_loader }}-${{ steps.gradle-properties.outputs.MOD_VERSION }}+mc${{ matrix.version }}
                    if-no-files-found: error
                    path: ${{ steps.default-fabric-jar.outputs.path || format('./{0}/versions/{1}/build/libs/*.jar', matrix.mod_loader, matrix.version) }}
                    # 1.21.1 Fabric is a single original .jar, never a nested ZIP.
                    archive: ${{ !(matrix.mod_loader == 'fabric' && matrix.version == '1.21.1') }}

    run-client:
        runs-on: ubuntu-latest
        needs: [ build, generate-build-matrix ]
        if: ${{ success() && !cancelled() }}
        strategy:
            fail-fast: false
            matrix: ${{ fromJson(needs.generate-build-matrix.outputs.matrix) }}

        name: Run ${{ matrix.mod_loader }} ${{ matrix.version }} client
        timeout-minutes: 10

        steps:
            -   name: "Checkout repository"
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            -   name: "Set up JDK"
                uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
                with:
                    java-version: 25
                    distribution: temurin

            -   name: "Parse gradle properties"
                id: gradle-properties
                run: ./.github/scripts/parse-gradle-properties.sh ${{ matrix.version }}

            -   name: "Download artifacts"
                uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
                with:
                    # Direct single-JAR artifacts are named after the actual Gradle file.
                    name: ${{ (matrix.mod_loader == 'fabric' && matrix.version == '1.21.1') && format('{0}-{1}-{2}+mc{3}.jar', steps.gradle-properties.outputs.MOD_ID, matrix.mod_loader, steps.gradle-properties.outputs.MOD_VERSION, matrix.version) || format('{0}-{1}-{2}+mc{3}', steps.gradle-properties.outputs.MOD_ID, matrix.mod_loader, steps.gradle-properties.outputs.MOD_VERSION, matrix.version) }}
                    path: ./${{ matrix.mod_loader }}/versions/${{ matrix.version }}/build/libs

            -   name: "Copy mod jar to run/mods"
                run: mkdir -p run/mods && cp ./${{ matrix.mod_loader }}/versions/${{ matrix.version }}/build/libs/*.jar run/mods

            -   name: "Download ResourcefulLib"
                run: |
                    MOD_URL=$(./.github/scripts/get-modrinth-dependency-url.sh "resourceful-lib" "${{ steps.gradle-properties.outputs.DEPS_RESOURCEFUL_LIB_LIB }}" "${{ matrix.mod_loader }}")
                    wget -P run/mods "$MOD_URL"

            -   name: "Download YACL"
                if: ${{ steps.gradle-properties.outputs.DEPS_YACL != '' }}
                run: |
                    MOD_URL=$(./.github/scripts/get-modrinth-dependency-url.sh "yacl" "${{ steps.gradle-properties.outputs.DEPS_YACL }}-${{ matrix.mod_loader }}" "${{ matrix.mod_loader }}")
                    wget -P run/mods "$MOD_URL"

            -   name: "Install software rendering"
                if: ${{ matrix.version == '26.3' }}
                run: |
                    sudo apt-get update
                    sudo apt-get install -y libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers

            -   name: Run ${{ matrix.version }} ${{ matrix.mod_loader }} client
                uses: headlesshq/mc-runtime-test@645691de43520240e1d1e45b4b9a4d9cd9c294a4 # v4.5.2
                with:
                    mc: ${{ matrix.version }}
                    modloader: ${{ matrix.mod_loader }}
                    regex: .*${{ matrix.mod_loader }}.*
                    mc-runtime-test: ${{ matrix.mod_loader_alias }}
                    java: ${{ steps.gradle-properties.outputs.JAVA_VERSION }}
                    fabric-api: ${{ steps.gradle-properties.outputs.DEPS_FABRIC_API }}
                    fabric-gametest-api: none
                    xvfb: ${{ matrix.version == '26.3' }}
                    headlessmc-command: ${{ matrix.version == '26.3' && '--retries 3 --jvm -Djava.awt.headless=true -DMcRuntimeGameTest=false' || '-lwjgl --retries 3 --jvm -Djava.awt.headless=true -DMcRuntimeGameTest=false' }}
                    cache-mc: true

    run-server:
        runs-on: ubuntu-latest
        needs: [ build, generate-build-matrix ]
        if: ${{ success() && !cancelled() }}
        strategy:
            fail-fast: false
            matrix: ${{ fromJson(needs.generate-build-matrix.outputs.matrix) }}

        name: Run ${{ matrix.mod_loader }} ${{ matrix.version }} server
        timeout-minutes: 10

        steps:
            -   name: "Checkout repository"
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    fetch-depth: 1

            -   name: "Set up JDK"
                uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
                with:
                    java-version: 25
                    distribution: temurin

            -   name: "Parse gradle properties"
                id: gradle-properties
                run: ./.github/scripts/parse-gradle-properties.sh ${{ matrix.version }}

            -   name: "Download artifacts"
                uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
                with:
                    # Direct single-JAR artifacts are named after the actual Gradle file.
                    name: ${{ (matrix.mod_loader == 'fabric' && matrix.version == '1.21.1') && format('{0}-{1}-{2}+mc{3}.jar', steps.gradle-properties.outputs.MOD_ID, matrix.mod_loader, steps.gradle-properties.outputs.MOD_VERSION, matrix.version) || format('{0}-{1}-{2}+mc{3}', steps.gradle-properties.outputs.MOD_ID, matrix.mod_loader, steps.gradle-properties.outputs.MOD_VERSION, matrix.version) }}
                    path: ./${{ matrix.mod_loader }}/versions/${{ matrix.version }}/build/libs

            -   name: "Copy mod jar to run/mods"
                run: mkdir -p run/mods && cp ./${{ matrix.mod_loader }}/versions/${{ matrix.version }}/build/libs/*.jar run/mods

            -   name: "Download ResourcefulLib"
                run: |
                    MOD_URL=$(./.github/scripts/get-modrinth-dependency-url.sh "resourceful-lib" "${{ steps.gradle-properties.outputs.DEPS_RESOURCEFUL_LIB_LIB }}" "${{ matrix.mod_loader }}")
                    wget -P run/mods "$MOD_URL"

            -   name: Run ${{ matrix.version }} ${{ matrix.mod_loader }} server
                uses: headlesshq/mc-server-test@42de00da95e997b046a43eb9beb516494e542ba9 # v1.1.1
                with:
                    mc: ${{ matrix.version }}
                    modloader: ${{ matrix.mod_loader }}
                    java: ${{ steps.gradle-properties.outputs.JAVA_VERSION }}
                    fabric-api: ${{ steps.gradle-properties.outputs.DEPS_FABRIC_API }}
                    fabric-gametest-api: none
                    headlessmc-command: -lwjgl --retries 3 --jvm -Djava.awt.headless=true
                    cache-mc: true
